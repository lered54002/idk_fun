<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cramstack: Study Card Packs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap">
<style>
:root{--bg:#f3f1fb;--panel:#fff;--ink:#1d1a36;--mute:#6b6889;--line:#dedaf0;--gem:#0ea5a4;--c0:#8a94a6;--c1:#3b82f6;--c2:#a855f7;--c3:#f59e0b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122b;--panel:#1f1c40;--ink:#f1eeff;--mute:#a29fc6;--line:#332f5e;--gem:#2dd4bf}}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:500}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.5px;flex:1}
.gems{background:var(--panel);border:2px solid var(--gem);border-radius:99px;padding:6px 14px;font-weight:800;color:var(--gem)}
.btn{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-weight:700}
.btn.alt{background:var(--panel);color:var(--ink);border:2px solid var(--line)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
nav{display:flex;gap:6px;padding:12px 16px 0;max-width:960px;margin:auto}
nav button{background:none;padding:8px 14px;border-radius:10px;font-weight:700;color:var(--mute)}
nav button.on{background:var(--panel);color:var(--ink);box-shadow:inset 0 -3px 0 var(--c2)}
main{max-width:960px;margin:auto;padding:16px}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.pack{background:var(--panel);border-radius:18px;padding:18px;text-align:center;border-top:8px solid var(--pc)}
.pack .art{font-size:54px;height:130px;display:grid;place-items:center;margin:0 auto 10px;width:96px;border-radius:12px;background:linear-gradient(145deg,var(--pc),#0004);box-shadow:0 8px 18px #0003;transform:rotate(-3deg)}
.pack h3{margin:6px 0 2px}.pack p{margin:0 0 12px;color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{aspect-ratio:3/4;perspective:700px;background:none;padding:0;text-align:left}
.in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;border:3px solid var(--rc);background:var(--panel);font-size:14px;overflow:hidden}
.b{transform:rotateY(180deg);background:var(--rc);color:#fff;font-size:20px;font-weight:800;justify-content:center;text-align:center}
.card.r2 .f{box-shadow:0 0 14px var(--rc)}.card.r3 .f{box-shadow:0 0 22px var(--rc);background:linear-gradient(160deg,var(--panel),#f59e0b33)}
.tag{font-size:12px;font-weight:800;color:var(--rc)}
.lock .f{opacity:.45;border-style:dashed;align-items:center;justify-content:center;color:var(--mute);font-size:30px}
.cnt{position:absolute;top:6px;right:8px;font-size:12px;font-weight:800;background:var(--rc);color:#fff;border-radius:99px;padding:1px 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--panel);padding:7px 13px;border-radius:99px;border:2px solid var(--line);font-weight:700}
.chip.on{border-color:var(--ink)}
.ov{position:fixed;inset:0;background:#0009;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;overflow:auto}
.ov .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.ov .card{width:min(180px,28vw);min-width:130px}
.ov .b{font-size:46px}
.ov .b{background:linear-gradient(145deg,var(--pc),#222)}
.note{color:#fff;font-weight:700;text-align:center;min-height:24px}
.modal{background:var(--panel);border-radius:18px;padding:24px;text-align:center;max-width:340px}
.study{background:var(--panel);border-radius:18px;padding:24px;max-width:520px;margin:auto;text-align:center}
.study .q{font-size:24px;font-weight:800;margin:18px 0;min-height:60px}
.study .a{font-size:20px;color:var(--gem);font-weight:800;min-height:30px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:30;font-weight:700}
@media (prefers-reduced-motion:reduce){.in{transition:none}}
</style>
</head>
<body>
<header><h1>Cramstack</h1><span class="gems" id="gems"></span><button class="btn alt" id="adBtn">Watch ad: +50 gems</button></header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="layer"></div>
<script>
var R=[{n:"Common",g:10},{n:"Rare",g:25},{n:"Epic",g:60},{n:"Legendary",g:150}],COST=100,AD=50,W=[60,28,9,3];
var P=[
{k:"bio",n:"Biology",e:"🧬",c:"#16a34a",d:[["Which organelle is the powerhouse of the cell?","Mitochondria",0],["What molecule carries genetic information?","DNA",0],["What do plants make from light, water and CO₂?","Glucose (photosynthesis)",0],["What is the basic unit of life?","The cell",0],["Which organelle builds proteins?","Ribosome",0],["Which base pairs with adenine in DNA?","Thymine",1],["What are enzymes made of?","Proteins",1],["Which cell division makes gametes?","Meiosis",1],["Which molecule is the cell’s energy currency?","ATP",2],["What is DNA to mRNA copying called?","Transcription",3]]},
{k:"his",n:"History",e:"🏛️",c:"#d97706",d:[["Who was the first US president?","George Washington",0],["In what year did World War II end?","1945",0],["Who built the pyramids at Giza?","Ancient Egyptians",0],["Year Columbus reached the Americas?","1492",0],["In what year did the Berlin Wall fall?","1989",0],["Who mainly wrote the US Declaration of Independence?","Thomas Jefferson",1],["Which country had a revolution in 1789?","France",1],["Who was the first Roman emperor?","Augustus",1],["Which treaty formally ended World War I?","Treaty of Versailles",2],["In what year was Magna Carta sealed?","1215",3]]},
{k:"spa",n:"Spanish",e:"🌮",c:"#dc2626",d:[["Hello","Hola",0],["Thank you","Gracias",0],["Water","Agua",0],["Cat","Gato",0],["Goodbye","Adiós",0],["Library","Biblioteca",1],["I am hungry","Tengo hambre",1],["Where is the bathroom?","¿Dónde está el baño?",1],["Nevertheless","Sin embargo",2],["To take advantage of","Aprovechar",3]]},
{k:"che",n:"Chemistry",e:"⚗️",c:"#2563eb",d:[["Chemical formula of water?","H₂O",0],["Symbol for gold?","Au",0],["Symbol for sodium?","Na",0],["What do atomic numbers count?","Protons",0],["pH of a neutral solution?","7",0],["Which noble gas is lightest?","Helium",1],["Which bond shares electron pairs?","Covalent bond",1],["Avogadro’s number?","6.022 × 10²³",1],["Symbol for tungsten?","W",2],["Most electronegative element?","Fluorine",3]]}];
var S={gems:200,own:{}},tab="shop",flt="all",study=null;
try{var s=JSON.parse(localStorage.getItem("cramstack")||"null");if(s&&typeof s.gems==="number")S=s}catch(e){}
function save(){try{localStorage.setItem("cramstack",JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},1800)}
function rc(r){return "var(--c"+r+")"}
function draw(p){var x=Math.random()*100,r=0;for(var i=0;i<4;i++){if(x<W[i]){r=i;break}x-=W[i]}
 var pool=[];p.d.forEach(function(c,i){if(c[2]===r)pool.push(i)});var i=pool[Math.floor(Math.random()*pool.length)];return i}
function head(){$("gems").textContent="💎 "+S.gems;
 $("nav").innerHTML=[["shop","Packs"],["col","Collection"],["study","Study"]].map(function(t){return '<button class="'+(tab===t[0]?"on":"")+'" data-t="'+t[0]+'">'+t[1]+'</button>'}).join("")}
function cardHTML(p,i,n,extra){var c=p.d[i],own=n>0;
 if(!own)return '<div class="card lock" style="--rc:var(--mute)"><div class="in"><div class="f">?</div></div></div>';
 return '<button class="card r'+c[2]+'" style="--rc:'+rc(c[2])+'" data-flip aria-label="Flip card"><div class="in"><div class="f"><span class="tag">'+R[c[2]].n+' · '+p.n+'</span><b>'+c[0]+'</b><span style="color:var(--mute);font-size:12px">Tap to flip</span></div><div class="b">'+c[1]+'</div></div>'+(n>1?'<span class="cnt">×'+n+'</span>':'')+(extra||'')+'</button>'}
function render(){head();var m=$("main"),h="";
 if(tab==="shop"){h='<div class="packs">'+P.map(function(p){return '<div class="pack" style="--pc:'+p.c+'"><div class="art">'+p.e+'</div><h3>'+p.n+' pack</h3><p>3 cards · '+p.d.length+' to collect</p><button class="btn" data-open="'+p.k+'"'+(S.gems<COST?" disabled":"")+'>Open for 💎 '+COST+'</button></div>'}).join("")+'</div><p style="color:var(--mute)">Duplicates turn into gems: Common 💎10, Rare 💎25, Epic 💎60, Legendary 💎150. Low on gems? Watch an ad or study your cards.</p>'}
 if(tab==="col"){h='<div class="chips"><button class="chip '+(flt==="all"?"on":"")+'" data-f="all">All</button>'+P.map(function(p){var o=p.d.filter(function(c,i){return S.own[p.k+i]}).length;return '<button class="chip '+(flt===p.k?"on":"")+'" data-f="'+p.k+'">'+p.e+' '+p.n+' '+o+'/'+p.d.length+'</button>'}).join("")+'</div><div class="grid">';
  P.forEach(function(p){if(flt==="all"||flt===p.k)p.d.forEach(function(c,i){h+=cardHTML(p,i,S.own[p.k+i]||0)})});h+='</div>'}
 if(tab==="study"){
  if(!study){h='<p>Pick a subject. Cards you own go into a quiz, and each one you know earns 💎 5.</p><div class="chips">'+P.map(function(p){return '<button class="chip" data-s="'+p.k+'">'+p.e+' '+p.n+'</button>'}).join("")+'</div>'}
  else if(!study.q.length){h='<div class="study"><div class="q">Round complete! You got '+study.ok+' right.</div><button class="btn" data-s="end">Back</button></div>'}
  else{var c=study.q[0];h='<div class="study"><span class="tag" style="color:'+rc(c.r)+'">'+R[c.r].n+' · '+study.p.n+' · '+study.q.length+' left</span><div class="q">'+c.q+'</div><div class="a">'+(study.show?c.a:"")+'</div>'+(study.show?'<button class="btn alt" data-s="again">Again</button> <button class="btn" data-s="ok">Got it +💎5</button>':'<button class="btn" data-s="show">Show answer</button>')+'</div>'}}
 m.innerHTML=h}
function startStudy(k){var p=P.filter(function(x){return x.k===k})[0],q=[];
 p.d.forEach(function(c,i){if(S.own[k+i])q.push({q:c[0],a:c[1],r:c[2]})});
 if(!q.length){toast("Open a "+p.n+" pack first to get cards");return}
 q.sort(function(){return Math.random()-.5});study={p:p,q:q,show:false,ok:0}}
function openPack(k){var p=P.filter(function(x){return x.k===k})[0];if(S.gems<COST)return;S.gems-=COST;
 var res=[],refund=0;for(var n=0;n<3;n++){var i=draw(p),id=k+i,dup=(S.own[id]||0)>0||res.some(function(r){return r.i===i});
  if(dup)refund+=R[p.d[i][2]].g;S.own[id]=(S.own[id]||0)+1;res.push({i:i,dup:dup})}
 S.gems+=refund;save();head();var left=3;
 var el=document.createElement("div");el.className="ov";
 el.innerHTML='<div class="note" id="nt">Tap each card to reveal</div><div class="row">'+res.map(function(r,n){var c=p.d[r.i];return '<button class="card r'+c[2]+'" style="--rc:'+rc(c[2])+';--pc:'+p.c+'" data-rev="'+n+'"><div class="in"><div class="f" style="background:linear-gradient(145deg,'+p.c+',#222);align-items:center;justify-content:center;font-size:46px;color:#fff">'+p.e+'</div><div class="b" style="background:var(--panel);color:var(--ink);font-size:14px;justify-content:space-between;text-align:left;align-items:stretch"><span class="tag">'+R[c[2]].n+'</span><b>'+c[0]+'</b><span style="color:var(--gem);font-weight:800">'+c[1]+'</span><span class="tag" style="color:'+(r.dup?'var(--gem)':'#16a34a')+'">'+(r.dup?'Duplicate → 💎 '+R[c[2]].g:'New card!')+'</span></div></div></button>'}).join("")+'</div><button class="btn" id="done" style="display:none">'+(refund?"Collect 💎 "+refund:"Continue")+'</button>';
 el.addEventListener("click",function(e){var b=e.target.closest("[data-rev]");if(b&&!b.classList.contains("flip")){b.classList.add("flip");if(--left===0){$("done").style.display="";$("nt").textContent=refund?"Duplicates gave you 💎 "+refund:"All new!"}}
  if(e.target.id==="done"){el.remove();render()}});
 $("layer").appendChild(el)}
function ad(){var el=document.createElement("div");el.className="ov";var t=5;
 el.innerHTML='<div class="modal"><p style="color:var(--mute);margin:0">Sponsored (demo ad)</p><div style="font-size:56px;margin:10px">📣</div><h3 style="margin:0 0 6px">Your ad could be here</h3><p id="at">Reward in 5s</p><button class="btn" id="claim" disabled>Claim 💎 '+AD+'</button> <button class="btn alt" id="skip">Close</button></div>';
 var iv=setInterval(function(){t--;if(t>0)$("at").textContent="Reward in "+t+"s";else{clearInterval(iv);$("at").textContent="Thanks for watching!";$("claim").disabled=false}},1000);
 el.addEventListener("click",function(e){if(e.target.id==="skip"){clearInterval(iv);el.remove()}
  if(e.target.id==="claim"&&!e.target.disabled){S.gems+=AD;save();el.remove();render();toast("+"+AD+" gems")}});
 $("layer").appendChild(el)}
document.addEventListener("click",function(e){var t=e.target,b;
 if(t.id==="adBtn")return ad();
 if(b=t.closest("[data-t]")){tab=b.dataset.t;return render()}
 if(b=t.closest("[data-open]"))return openPack(b.dataset.open);
 if(b=t.closest("[data-f]")){flt=b.dataset.f;return render()}
 if(b=t.closest("[data-s]")){var a=b.dataset.s;
  if(a==="end")study=null;else if(a==="show")study.show=true;
  else if(a==="ok"){S.gems+=5;study.ok++;study.q.shift();study.show=false;save()}
  else if(a==="again"){study.q.push(study.q.shift());study.show=false}
  else startStudy(a);return render()}
 if((b=t.closest("[data-flip]"))&&!t.closest(".ov"))b.classList.toggle("flip")});
render();
</script>
</body>
</html>
